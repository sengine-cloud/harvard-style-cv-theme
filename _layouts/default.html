<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} · {{ site.affiliation | default: site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    {% if site.goatcounter %}
    <!-- GoatCounter analytics -->
    <script>
        window.goatcounter = {
            // Tag each pageview with the deployed commit so views map to a version.
            // {{ site.commit_short }} is provided by the consuming site (optional); falls back to "dev".
            path: function (p) {
                return (
                    p +
                    (p.indexOf("?") > -1 ? "&" : "?") +
                    'v={{ site.commit_short | default: "dev" }}'
                );
            },
        };
    </script>
    <script data-goatcounter="{{ site.goatcounter }}/count" async src="{{ site.goatcounter }}/count.js"></script>
    {% endif %}

    {% if site.tianji.url and site.tianji.website_id %}
    <!-- Tianji analytics -->
    <script async defer src="{{ site.tianji.url }}/tracker.js" data-website-id="{{ site.tianji.website_id }}"></script>
    {% endif %}

    {% if site.google_analytics %}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>

<body>
    <main>
        {{ content }}
    </main>
</body>

</html>
